services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXUSDESK_HOME: /data
      WATCH_DIR: /data/watch
      OLLAMA_HOST: ${OLLAMA_HOST:-http://i9atendimento_ollama:11434}
      OLLAMA_PULL: ${OLLAMA_PULL:-llama3.2}
    volumes:
      - nexus_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  nexus_data:
